2m 23s 동안 처리함
응. 그 구성이 훨씬 낫습니다. 지금 구조는 PI 소개 뒤에 Academic Appointments → Leadership → Service → Education → Awards가 계속 이어지고 나서야 Team이 시작해서, 말씀하신 것처럼 PI와 Team의 큰 구획이 잘 안 느껴집니다. 실제 현재 build.py도 그 순서로 출력하고 있어요. 


그래서 제가 이렇게 바꿨습니다.

01 · Principal Investigator
→ 사진 + 기본정보
→ Academic Appointments
→ Academic Leadership
→ Academic Service
→ Education
→ Honors & Awards

02 · Team
→ Current Members

03 · Alumni
→ Alumni 목록

