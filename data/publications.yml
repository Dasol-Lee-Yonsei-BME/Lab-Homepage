September 1, 2026 – Present

같은 문장이 사진처럼 3줄로 쪼개지지 않게 했습니다. 화면이 작은 모바일에서는 억지로 좁게 압축하지 않고 기간이 제목 위의 별도 한 줄로 이동하도록 했습니다.

이번에는 style.css를 또 따로 건드릴 필요 없게 People 전용 스타일을 build.py 안에 같이 넣었습니다. 그래서 파일 하나만 통째로 교체하면 됩니다.

이것 하나만 교체하세요

GitHub에서

Lab-Homepage → scripts → build.py → Edit

들어가서 기존 내용 전체 삭제 → 위 파일 내용 전체 복붙 → Commit changes 하면 됩니다.

people.yml은 이번에는 안 건드려도 됩니다.

그리고 이 파일은 제가 Python 문법 검사 + 실제 사이트 빌드까지 돌려서 BUILD_OK 확인했습니다. 배포되고 나면 People 페이지가 지금보다 훨씬 명확하게 PI / Team / Alumni의 3개 큰 챕터처럼 보일 겁니다.

이게 적용된 화면 한번 보고 나면, 그다음에는 PI의 Academic Appointments 같은 소제목 크기를 조금 더 줄일지 그대로 둘지만 보면 될 것 같아요.



좋다. 그 다음으로 가자

좋아요. 다음은 Publications로 가죠. 여기까지 Home → Research → People이 정리됐으니 순서상 딱 좋습니다.

Publications에서는 특히 이 네 가지를 보겠습니다: 연도 구분, 논문 대표 이미지, 제목·저자·저널 정보의 위계, 그리고 IF / JCR 표시가 과하지 않게 보이는지입니다. 기존 설계상 논문 이미지는 필수이고, 연도는 자동으로 최신순 정렬되도록 되어 있습니다.

우선 현재 Publications 페이지 전체가 보이게 스크린샷 하나 보내주세요. 위쪽과 논문 카드 2~3개 정도만 보여도 충분합니다.

그 화면 보고 디자인부터 정리한 뒤, 이번에도 필요하면 파일 통째로 교체하는 방식으로 갈게요.


b5658ff4-53b5-4aa8-868a-2998dae7d488.png
이런느낌이거든?
우선, Publications 설명란에는
1저자 및 공동 1저자는 dagger, 교신저자는 *, 파란색 글자는 내 랩 학생이라는 것을 표시하는 것으로 대체
(bnsl.yonsei.ac.kr 참고)

그리고, 실제로 논문은 전체 논문을 다 쓰는 것으로. 지금은 2021년도 이후로만 되어있네.
저자목록도 다 쓰고, dagger와 * 모두 잘 표시하고, 내 학생 파란색도 잘 표시하는 것으로 하자. 거기에 추가적으로, Dasol Lee에는 bold, 밑줄표시로(검정 유지)
이것도 이전 홈페이지 참고

그리고, 2026년도 논문에는 JCR 퍼센트는 있는데, 분야에 년도가 빠졌거든? 이거 그냥 2025 기준으로 써주면 돼. 항상 그냥 전년도 JCR 기준으로 입력하려고 해.

View paper에는 링크가 다 다른게 들어가있는 것 같은데, 업데이트 어려우면 내가 할테니, 편하게 링크 넣을 수 있도록 양식 구성해줘

그리고, 년도별 링크? 이게 비활성화 되어있는데, 활성화 해주고

6m 34s 동안 처리함
응. 이번에는 요청한 내용들을 한 번에 반영해서 파일 통째로 교체할 수 있게 만들어놨어요.

기존 BNSL Publications 페이지의 표기법—† first/co-first author, * corresponding author, lab student 강조—을 기준으로 잡았고, 기존 사이트에 있던 2026년부터 Before Yonsei University 시절의 2015년 논문까지 전체 Journal Paper 목록을 반영했습니다. 
 
 

이번 버전에서는 다음처럼 바뀝니다.

저자 전부 표시: 더 이상 et al.로 줄이지 않음.

† = 1저자 / 공동 1저자, * = 교신저자.

SOL 학생/졸업생은 파란색. 기존 BNSL Students 페이지의 current/alumni 명단을 기준으로 자동 강조되도록 했습니다. 
 

Dasol Lee / D. Lee는 검정 + Bold + 밑줄.

2026 논문의 JCR 분야에는 모두 2025가 표시됩니다. 앞으로도 JCR이 입력되어 있으면 논문연도 - 1을 기준으로 관리하는 구조입니다.

연도 버튼이 실제 링크가 되어 2026, 2025, 2024 등을 누르면 해당 연도로 바로 이동합니다.

저자가 매우 많은 mega-review는 자동으로 2열 전체 폭을 쓰는 큰 카드가 되어 저자 목록이 덜 답답하게 나옵니다.

기존 이미지가 없는 과거 논문은 자동으로 Archive placeholder가 들어갑니다. 나중에 실제 이미지를 넣으면 자동 교체됩니다.

View Paper는 잘못된 출판사 메인페이지로 보내지 않도록 일단 URL을 비워두었습니다. url:만 입력하면 버튼이 자동으로 생깁니다.

링크 입력은 앞으로 publications.yml에서 정말 이것만 바꾸면 됩니다.

url: "https://doi.org/10.xxxx/xxxxx"
비어 있으면 VIEW PAPER 버튼 자체가 안 뜹니다.

그리고 이번에도 style.css는 건드릴 필요 없습니다. Publications 전용 디자인 수정은 build.py 안에 넣었습니다.

교체할 파일 2개
scripts/build.py

data/publications.yml

두 개가 같이 들어 있는 파일도 있습니다.


추천 순서: 먼저 data/publications.yml 전체 교체 → Commit, 그다음 scripts/build.py 전체 교체 → Commit 하세요. 마지막 Actions가 초록 체크가 되면 됩니다.

제가 이 두 파일 조합으로 실제 빌드를 돌려봤고 BUILD_OK까지 확인했습니다. 적용 후 Publications 화면 캡처 한번 보여주시면, 그다음은 카드 크기나 저자 글씨 크기 같은 디자인 미세조정만 하면 될 것 같아요.




