hero_lead: We explore next-generation bio-nanophotonics for imaging, sensing, thermal management, and optical systems.
intro: The Bio-Nanophotonics System Laboratory (BNSL) at Yonsei University led by Prof. Dasol Lee investigates innovative next-generation research focusing on bio-nanophotonics. Our main research fields include nanophotonics-based imaging platforms, ultra-sensitive optical sensors, passive radiative cooling for biomedical thermal management, and advanced optical systems.
