intro: "Photonics Lab. at Yonsei University, led by Dasol Lee (이다솔), explores the science and engineering of light to create new ways of seeing, sensing, and interacting with the world. We develop optical technologies and systems across imaging, sensing, and thermal applications, with the goal of translating fundamental ideas into meaningful solutions for biomedical and emerging applications."
